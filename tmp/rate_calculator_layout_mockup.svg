<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1900" viewBox="0 0 1200 1900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10161f" />
      <stop offset="100%" stop-color="#0b1017" />
    </linearGradient>
    <style>
      .title { font: 700 34px 'Segoe UI', sans-serif; fill: #f4f7fb; }
      .label { font: 700 18px 'Segoe UI', sans-serif; fill: #c4cedb; letter-spacing: 1px; }
      .txt { font: 600 22px 'Segoe UI', sans-serif; fill: #f4f7fb; }
      .sub { font: 500 18px 'Segoe UI', sans-serif; fill: #97a7bc; }
      .btn { font: 700 20px 'Segoe UI', sans-serif; fill: #08111d; }
      .chip { font: 700 16px 'Segoe UI', sans-serif; fill: #cfe4ff; }
      .timer { font: 700 20px 'Segoe UI', sans-serif; fill: #b6f2c1; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="1900" fill="url(#bg)"/>

  <text x="80" y="90" class="title">Rate Calculator (Mockup)</text>

  <rect x="60" y="140" rx="22" ry="22" width="1080" height="260" fill="#171f2a" stroke="#2c3746"/>
  <text x="95" y="185" class="label">TANK SELECTION</text>
  <rect x="95" y="215" rx="14" ry="14" width="770" height="70" fill="#0f1723" stroke="#334154"/>
  <text x="120" y="258" class="txt">V-Bottom ▼</text>
  <rect x="885" y="215" rx="14" ry="14" width="220" height="70" fill="#d6ae69"/>
  <text x="952" y="258" class="btn">Add Tank</text>
  <text x="95" y="322" class="sub">Chart-based tank • flowback500</text>
  <rect x="95" y="338" rx="20" ry="20" width="150" height="36" fill="#1f2f43"/>
  <text x="115" y="362" class="chip">Chart tank</text>
  <rect x="255" y="338" rx="20" ry="20" width="220" height="36" fill="#1f2f43"/>
  <text x="275" y="362" class="chip">4 tanks available</text>

  <rect x="60" y="430" rx="22" ry="22" width="1080" height="260" fill="#171f2a" stroke="#2c3746"/>
  <text x="95" y="475" class="label">ACTIVE CALCULATORS</text>

  <rect x="95" y="505" rx="14" ry="14" width="250" height="150" fill="#22344b" stroke="#4f87c5"/>
  <text x="115" y="548" class="txt">V-Bottom</text>
  <text x="115" y="582" class="timer">Running 08:12</text>
  <text x="115" y="615" class="sub">Current</text>

  <rect x="365" y="505" rx="14" ry="14" width="250" height="150" fill="#0f1723" stroke="#334154"/>
  <text x="385" y="548" class="txt">Round Bottom</text>
  <text x="385" y="582" class="timer">Running 02:46</text>
  <text x="385" y="615" class="sub">Tap to open</text>

  <rect x="635" y="505" rx="14" ry="14" width="250" height="150" fill="#0f1723" stroke="#334154"/>
  <text x="655" y="548" class="txt">Production Tank</text>
  <text x="655" y="582" class="sub">No timer</text>
  <text x="655" y="615" class="sub">Tap to open</text>

  <rect x="905" y="505" rx="14" ry="14" width="200" height="150" fill="#0f1723" stroke="#334154"/>
  <text x="925" y="548" class="txt">MR 810039</text>
  <text x="925" y="582" class="sub">Finished</text>
  <text x="925" y="615" class="sub">Tap to open</text>

  <rect x="60" y="720" rx="22" ry="22" width="1080" height="640" fill="#171f2a" stroke="#2c3746"/>
  <text x="95" y="770" class="label">INPUTS + TIMER + RESULTS</text>

  <rect x="95" y="800" rx="12" ry="12" width="1010" height="70" fill="#0f1723" stroke="#334154"/>
  <text x="120" y="842" class="txt">Starting Gauge</text>

  <rect x="95" y="885" rx="12" ry="12" width="1010" height="70" fill="#0f1723" stroke="#334154"/>
  <text x="120" y="927" class="txt">Ending Gauge</text>

  <rect x="95" y="970" rx="12" ry="12" width="1010" height="70" fill="#0f1723" stroke="#334154"/>
  <text x="120" y="1012" class="txt">Timer: 10:00</text>

  <rect x="95" y="1060" rx="14" ry="14" width="320" height="66" fill="#d6ae69"/>
  <text x="145" y="1102" class="btn">Start Timer</text>
  <rect x="430" y="1060" rx="14" ry="14" width="320" height="66" fill="#22344b" stroke="#4f87c5"/>
  <text x="500" y="1102" class="txt">Calculate Rate</text>

  <rect x="95" y="1150" rx="14" ry="14" width="1010" height="180" fill="#0f1723" stroke="#334154"/>
  <text x="120" y="1195" class="txt">Results</text>
  <text x="120" y="1235" class="sub">BBL/min: 2.378   •   BBL/hr: 142.7   •   BPD: 3424.8</text>

  <rect x="60" y="1400" rx="22" ry="22" width="1080" height="430" fill="#171f2a" stroke="#2c3746"/>
  <text x="95" y="1450" class="label">RATE LOG (OPTIONAL)</text>
  <rect x="95" y="1480" rx="12" ry="12" width="1010" height="72" fill="#0f1723" stroke="#334154"/>
  <text x="120" y="1522" class="sub">9:41 AM - 2.378 BBL/min</text>
  <rect x="95" y="1565" rx="12" ry="12" width="1010" height="72" fill="#0f1723" stroke="#334154"/>
  <text x="120" y="1607" class="sub">9:22 AM - 2.102 BBL/min</text>

  <text x="60" y="1870" class="sub">Concept mockup for layout only (not pixel-perfect app screenshot).</text>
</svg>